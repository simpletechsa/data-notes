name: Build

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.${{ github.run_number }}"
        run: |
          sed -i "s/__VERSION__/1.${{ github.run_number }}/" android/app/src/main/assets/index.html
          gradle -p android assembleRelease --no-daemon
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk notes-v1.${{ github.run_number }}.apk
          gh release delete app-latest -y --cleanup-tag || true
          gh release delete latest -y --cleanup-tag || true
          gh release create latest notes-v1.${{ github.run_number }}.apk --title "v1.${{ github.run_number }}" --notes "latest build"
