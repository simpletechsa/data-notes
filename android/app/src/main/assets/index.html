<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>stsa Market Lab</title>
<style>
:root{--bg:#090d1a;--card:#121a30;--card2:#0d1426;--line:#202a46;--txt:#e8ebf5;--mut:#8f9ab3;--acc:#6c8cff;
--up:#ff4d4f;--down:#22c55e;--hot:#fb923c;--warm:#facc15;--cold:#60a5fa;--warn:#fbbf24}
body.us{--up:#22c55e;--down:#ff4d4f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.45}
header{position:sticky;top:0;z-index:5;background:rgba(9,13,26,.92);backdrop-filter:blur(10px);padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;letter-spacing:.3px}header h1 small{display:block;font-size:12px;color:var(--mut);font-weight:400}
.ib{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:12px;height:36px;min-width:36px;padding:0 10px;font-size:14px;font-weight:600}
main{padding:14px 14px 96px}
.tabpage{display:none}.tabpage.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:rgba(13,20,38,.97);border-top:1px solid var(--line);padding:6px 4px 6px}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8}
nav button.on{color:var(--acc)}
.card{background:linear-gradient(160deg,#151d36,#0f162b);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.h2{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;margin:18px 4px 8px;font-weight:700}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.big{font-size:30px;font-weight:800;line-height:1.1}.mid{font-size:20px;font-weight:700}
.mut{color:var(--mut);font-size:13px}.up{color:var(--up)}.down{color:var(--down)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card2);border-radius:12px;padding:10px;text-align:center}.tile b{display:block;font-size:17px;margin-top:2px}
.chip{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;background:#22305a;color:#c7d2fe;margin:2px 4px 2px 0}
.lv-hot{background:#3a2210;color:var(--hot)}.lv-warm{background:#3a3210;color:var(--warm)}.lv-cold{background:#10243a;color:var(--cold)}
.bar{height:6px;background:#1c2540;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#6c8cff,#a78bfa)}
.list .it{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}.list .it:last-child{border:0}
.it .nm{font-weight:600}.it .cd{font-size:12px;color:var(--mut)}.it .r{text-align:right;font-variant-numeric:tabular-nums}
.warnbox{background:#2a1d0b;border:1px solid #b45309;color:var(--warn);border-radius:14px;padding:12px;font-size:13.5px;margin-bottom:12px;font-weight:600}
.pct{font-size:26px;font-weight:800;color:var(--warm)}.pct small{display:block;font-size:11px;color:var(--mut);font-weight:400;text-align:right}
ul{margin:6px 0 0;padding-left:18px}li{margin:3px 0;font-size:14px}
.range{position:relative;height:44px;margin:8px 4px 4px}.range .ln{position:absolute;top:18px;left:0;right:0;height:8px;border-radius:9px;background:#1c2540}
.range .fill{position:absolute;top:18px;height:8px;border-radius:9px;background:linear-gradient(90deg,var(--down),var(--up))}
.range .pc{position:absolute;top:10px;width:2px;height:24px;background:#fff}.range .lab{position:absolute;top:30px;font-size:11px;color:var(--mut);transform:translateX(-50%);white-space:nowrap}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin-bottom:12px}.seg button{flex:1;border:0;background:none;color:var(--mut);padding:7px;border-radius:10px;font-weight:600;font-size:13px}.seg button.on{background:var(--acc);color:#fff}
.sheet{position:fixed;inset:0;background:#0009;z-index:20;display:none;align-items:flex-end}.sheet.on{display:flex}
.sheet .in{background:#10172c;border-top-left-radius:22px;border-top-right-radius:22px;width:100%;max-height:85vh;overflow:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom));animation:slide .25s}
@keyframes slide{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;background:#334;border-radius:9px;margin:0 auto 12px}
.empty{color:var(--mut);text-align:center;padding:26px 10px;font-size:14px}
.status{font-size:12px;color:var(--mut);text-align:center;margin:4px 0 10px}
.spin{animation:sp 1s linear infinite;display:inline-block}@keyframes sp{to{transform:rotate(360deg)}}
.opt{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}

};
let S = {lang: get("lang") || "en", col: get("col") || "tw", tab: "today", secFilter: "all", alView: "top"};
let D = {report: null, fc: null, note: null, log: null, fetched: null, offline: false};

function get(k){try{return localStorage.getItem("tsl-"+k)}catch(e){return null}}
function put(k,v){try{localStorage.setItem("tsl-"+k,v)}catch(e){}}
function t(k){return (T[S.lang][k]!==undefined)?T[S.lang][k]:k}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function pct(x,dec=1){if(x==null||x===""||isNaN(x))return "–";const v=x*100;return `<span class="${v>0?"up":v<0?"down":""}">${v>0?"+":""}${v.toFixed(dec)}%</span>`}
function num(x){return (x==null||x==="")?"–":Number(x).toLocaleString("en-US",{maximumFractionDigits:2})}
function nm(g){return S.lang==="zh"?(g.zh||g.group_zh):(g.en||g.group_en||g.zh||g.group_zh)}
function arrow(v){return v>0?"▲":v<0?"▼":"•"}

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let KEY=null,RSA=null;
async function getRSA(){if(RSA)return RSA;const k=get("rsa");if(!k)return null;RSA=await crypto.subtle.importKey("pkcs8",b64(k),{name:"RSA-OAEP",hash:"SHA-256"},false,["decrypt"]);return RSA}
async function getKey(){if(KEY)return KEY;const k=get("k");if(!k)return null;KEY=await crypto.subtle.importKey("raw",b64(k),"AES-GCM",false,["decrypt"]);return KEY}
async function unlock(){
  const pw=document.getElementById("pw").value;if(!pw)return;
  const err=document.getElementById("lockErr"),btn=document.getElementById("lockBtn");err.textContent="";btn.textContent=t("lockW");btn.disabled=true;
  const dead=get("x")==="1";               // 3 wrong tries: locked until the app is reinstalled (shown only as "wrong password")
  let ok=false,j=null,raw=null,v=null;
  try{
    v=await (await fetch("vault.json")).json();
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const wk=await crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:b64(v.salt),iterations:v.iter},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    raw=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(v.nonce),additionalData:new TextEncoder().encode("vault-v"+v.v)},wk,b64(v.ct));
    ok=true;
  }catch(e){ok=false}
  if(ok&&!dead){
    if(v.v>=2){j=JSON.parse(new TextDecoder().decode(raw));put("k",j.k);put("rsa",j.rsa)}
    else put("k",btoa(String.fromCharCode(...new Uint8Array(raw))));
    put("n","0");KEY=null;RSA=null;
    document.getElementById("lock").style.display="none";document.getElementById("pw").value="";load(true);
  }else{
    if(!dead){const n=(parseInt(get("n")||"0",10)||0)+1;put("n",String(n));if(n>=3)put("x","1")}
    err.textContent=t("lockE");document.getElementById("pw").value="";
  }
  btn.textContent=t("lockB");btn.disabled=false;
}
function showLock(){const l=document.getElementById("lock");l.style.display="flex";
  document.getElementById("lockTitle").textContent=t("lockT");document.getElementById("lockSub").textContent=t("lockS");document.getElementById("lockBtn").textContent=t("lockB")}
async function fetchJ(path,isText){
  const r=await fetch(BASE+path+".enc?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(r.status);
  const buf=new Uint8Array(await r.arrayBuffer());let plain;
  if(buf[0]===80&&buf[1]===49){ // "P1": sealed with the public lock (morning notes)
    const rk=await getRSA();if(!rk)throw new Error("no rsa");
    const L=(buf[2]<<8)|buf[3],wrapped=buf.slice(4,4+L),iv=buf.slice(4+L,16+L);
    const ak=await crypto.subtle.importKey("raw",await crypto.subtle.decrypt({name:"RSA-OAEP"},rk,wrapped),"AES-GCM",false,["decrypt"]);
    plain=await crypto.subtle.decrypt({name:"AES-GCM",iv},ak,buf.slice(16+L));
  }else{
    const key=await getKey();if(!key)throw new Error("locked");
    try{plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:buf.slice(2,14)},key,buf.slice(14))}catch(e){put("k","");put("rsa","");KEY=null;showLock();throw e}
  }
  const txt=new TextDecoder().decode(plain);return isText?txt:JSON.parse(txt)}
function parseCSV(txt){const lines=txt.replace(/^﻿/,"").trim().split(/\r?\n/);const h=lines.shift().split(",");return lines.map(l=>{const v=l.split(",");const o={};h.forEach((k,i)=>o[k]=v[i]);return o})}

async function load(force){
  if(!get("k")||!get("rsa")){showLock();return}
  const btn=document.getElementById("btnRefresh");btn.innerHTML='<span class="spin">⟳</span>';
  document.getElementById("status").textContent=t("loading");
  try{
    const [rep,fc,log,note,al,ast]=await Promise.all([fetchJ("report/latest.json"),fetchJ("report/forecast.json").catch(()=>null),
      fetchJ("forecast_log.csv",true).then(parseCSV).catch(()=>[]),fetchJ("report/morning_note.json").catch(()=>null),
      fetchJ("report/alerts_latest.json").catch(()=>null),fetchJ("report/alert_stats.json").catch(()=>null)]);
    D={report:rep,fc:fc,log:log,note:note,al:al,ast:ast,fetched:new Date().toISOString(),offline:false};
    put("cache",JSON.stringify(D));
  }catch(e){
    const c=get("cache");if(c){D=JSON.parse(c);D.offline=true}else{D.report=null}
  }
  btn.textContent="⟳";render();
}

function render(){
  document.documentElement.lang=S.lang==="zh"?"zh-Hant":"en";
  document.body.className=S.col==="us"?"us":"";
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  document.getElementById("nav").innerHTML=TABS.map(([k,ic])=>`<button class="${S.tab===k?"on":""}" onclick="go('${k}')">${ic}<span>${t(k)}</span></button>`).join("");
  document.querySelectorAll(".tabpage").forEach(p=>p.classList.toggle("on",p.id==="tab-"+S.tab));
  const st=document.getElementById("status");
  if(!D.report){st.textContent=t("fail");return}
  const when=D.fetched?new Date(D.fetched).toLocaleString(S.lang==="zh"?"zh-TW":"en-GB",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}):"";
  st.textContent=(D.offline?t("offline")+" · ":"")+t("updated")+" "+when;
  document.getElementById("hdrsub").textContent=t("dataFrom")+" "+D.report.date+" · v"+VERSION;
  ({today:rToday,ai:rAI,sectors:rSectors,picks:rPicks,alerts:rAlerts,paper:rPaper})[S.tab]();
}
function go(k){S.tab=k;window.scrollTo(0,0);render()}

/* ---------- TODAY ---------- */
function rToday(){
  const f=D.fc, el=document.getElementById("tab-today"), today=new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Taipei"});
  let h="";
  if(!f||f.date!==today){h+=`<div class="card"><div class="mid">${t("fc")}</div><div class="empty">${t("noFc")}</div></div>`}
  if(f){
    const p=f.pred,L=f.levels||{},pc=f.prev_close;
    h+=`<div class="card"><div class="row"><div class="mid">${t("fc")}</div><div class="sp"></div><div class="mut">${esc(f.date)} · ${t("made")} ${esc(f.made_at)}</div></div>
      <div class="grid2" style="margin-top:12px">
       <div class="tile">${t("open")}<b class="${p.open_gap>0?"up":"down"}" style="font-size:22px">${arrow(p.open_gap)} ${(p.open_gap*100).toFixed(1)}%</b><span class="mut">~${num(L.open_gap)}</span></div>
       <div class="tile">${t("close")}<b class="${p.close_ret>0?"up":"down"}" style="font-size:22px">${arrow(p.close_ret)} ${(p.close_ret*100).toFixed(1)}%</b><span class="mut">~${num(L.close_ret)}</span></div>
      </div>
      <div style="margin-top:14px" class="mut">${t("range")}</div>${rangeBar(L.low_ret,L.high_ret,pc)}`;
    const ext=Object.values(f.inputs||{}).some(v=>v!=null&&Math.abs(v)>0.03);
    if(ext)h+=`<div class="warnbox" style="margin:12px 0 0">${t("extreme")}</div>`;
    h+=`</div>`;
    h+=`<div class="h2">${t("inputs")}</div><div class="card"><div class="grid3">`+["sox","ndx","tsm","jp","kr","hynix"].map(k=>`<div class="tile"><span class="mut">${t(k)}</span><b>${pct(f.inputs[k])}</b></div>`).join("")+`</div></div>`;
    if(D.note&&D.note.date===f.date){const w=D.note["why_"+S.lang]||D.note.why_en||[];if(w.length)h+=`<div class="h2">${t("why")}</div><div class="card"><ul>${w.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`}
    const b=f.backtest||{};
    h+=`<div class="h2">${t("sure")}</div><div class="card"><div class="grid2">
      <div class="tile">${t("openDir")}<b>${Math.round((b.open_gap||{}).direction_hit*100)}%</b></div>
      <div class="tile">${t("closeDir")}<b>${Math.round((b.close_ret||{}).direction_hit*100)}%</b></div></div></div>`;
    const tr=f.track_record||{};
    h+=`<div class="h2">${t("score")}</div><div class="card">`;
    if(tr.days){const l=tr.last;
      h+=`<div class="grid2"><div class="tile">${t("open")}<b>${tr.open_right}/${tr.days}</b></div><div class="tile">${t("close")}<b>${tr.close_right}/${tr.days}</b></div></div>`;
      if(l)h+=`<div class="mut" style="margin-top:10px">${esc(l.date)}: ${t("open")} ${t("predicted")} ${num(l.pred_open)} → ${t("actual")} ${num(l.actual_open)} (${l.open_right==="1"||l.open_right===1?"✅ "+t("right"):"❌ "+t("wrong")}) · ${t("close")} ${num(l.pred_close)} → ${num(l.actual_close)} (${l.close_right==="1"||l.close_right===1?"✅ "+t("right"):"❌ "+t("wrong")})</div>`;
    }else h+=`<div class="mut">${t("scoreNone")}</div>`;
    h+=`</div>`;
  }
  const hot=D.report.heat.filter(x=>x.level==="hot");
  h+=`<div class="h2">${t("mood")}</div><div class="card"><div class="mut">${t("hotNow")}</div><div style="margin-top:6px">${hot.map(x=>`<span class="chip lv-hot">${esc(nm(x))} ${pct(x.r5)}</span>`).join("")}</div>
     <div class="mut" style="margin-top:10px">${t("aiAvg")}: <b>${Math.round(D.report.focus?.avg_heat||0)}</b>/100</div></div>`;
  h+=`<div class="mut" style="text-align:center;margin-top:16px">${t("about")}</div>`;
  el.innerHTML=h;
}
function rangeBar(lo,hi,pc){
  if(!lo||!hi||!pc)return "";
  const mn=Math.min(lo,pc)*0.997,mx=Math.max(hi,pc)*1.003,x=v=>((v-mn)/(mx-mn)*100).toFixed(1);
  return `<div class="range" style="height:30px"><div class="ln" style="top:11px"></div><div class="fill" style="top:11px;left:${x(lo)}%;width:${x(hi)-x(lo)}%"></div>
   <div class="pc" style="top:3px;left:${x(pc)}%"></div></div>
   <div class="grid3"><div class="tile">${t("low")}<b class="down">${num(Math.round(lo))}</b></div><div class="tile">${t("high")}<b class="up">${num(Math.round(hi))}</b></div>
   <div class="tile">${t("prev")}<b>${num(Math.round(pc))}</b></div></div>`;
}

/* ---------- PICKS ---------- */
function stockCard(p){
  return `<div class="card" onclick='openStock(${JSON.stringify(p.code)})'><div class="row"><div class="sp"><div class="cd">${esc(p.code)} · ${esc(p.industry)}</div>
   <div class="mid">${esc(p.name)}</div><span class="chip">${esc(nm(p))}</span></div><div class="pct">${Math.round(p.prob*100)}%<small>${t("chance")}</small></div></div>
   <div class="grid3" style="margin-top:8px"><div class="tile">${t("buy")}<b>${num(p.price)}</b></div><div class="tile">${t("target")}<b class="up">${num(p.target)}</b></div><div class="tile">${t("stop")}<b class="down">${num(p.stop)}</b></div></div>
   ${(p["flags_"+S.lang]||[]).length?`<div class="mut" style="margin-top:8px;color:var(--warn)">${t("signals")}</div><ul>${p["flags_"+S.lang].map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
   ${(p["why_"+S.lang]||[]).length?`<div class="mut" style="margin-top:8px">${t("why")}</div><ul>${p["why_"+S.lang].map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}</div>`;
}
function rPicks(){
  const r=D.report,st=r.stats,el=document.getElementById("tab-picks");let h="";
  if(st.rule_ret<=0||st.auc<0.53||st.rule_win-st.base_win<0.03)h+=`<div class="warnbox">${t("noEdge").replace("{w}",Math.round(st.rule_win*100)).replace("{b}",Math.round(st.base_win*100))}</div>`;
  h+=`<div class="h2">${t("top5")}</div>`+(r.picks.length?r.picks.map(stockCard).join(""):`<div class="empty">–</div>`);
  h+=`<div class="mut" style="margin:-4px 4px 8px">${t("sellBy").replace("{d}",r.plan.max_days)}</div>`;
  h+=`<div class="h2">${t("radar")}</div>`+(r.radar.length?r.radar.map(stockCard).join(""):`<div class="card empty">${t("noRadar")}</div>`);
  el.innerHTML=h;
}
function openStock(code){
  const r=D.report,all=[...r.picks,...r.radar,...(r.focus?r.focus.stocks:[])],p=all.find(x=>x.code===code);if(!p)return;
  sheet(stockCard(p).replace('class="card"','class="card" style="border:0;background:none;padding:0"'));
}

/* ---------- ALERTS ---------- */
function alLabel(type){const l=D.ast&&D.ast.labels&&D.ast.labels[type];return l?(S.lang==="zh"?l.zh:l.en):type}
function alDir(type){const l=D.ast&&D.ast.labels&&D.ast.labels[type];return l?l.dir:"bull"}
function alHist(type,ai){const t=D.ast&&D.ast.types&&D.ast.types[type];if(!t)return null;return (ai&&t.ai)?t.ai:t.all}
function alRow(r,i){const dir=r.direction||alDir(r.type);
  return `<div class="it" onclick="openAlert('${S.alView}',${i})"><div class="sp"><div class="nm">${esc(r.name)} <span class="cd">${esc(r.code)}</span></div>
   <div class="cd"><span style="color:var(--${dir==="bull"?"up":"down"})">${dir==="bull"?"▲":"▼"} ${esc(alLabel(r.type))}</span> · ${esc(r.time_tpe)}${r.ai==1||r.ai==="1"?' · <span class="chip" style="padding:0 6px">AI</span>':""}</div></div>
   <div class="r"><b>${num(r.price)}</b><div class="cd">${r.chg_pct!==""?pct(Number(r.chg_pct)/100):""}${r.vol_ratio?` · ${t("alVol")} ${Number(r.vol_ratio).toFixed(1)}x`:""}${Number(r.stock_news_n)>0?` · 📰${r.stock_news_n}`:""}</div></div></div>`}
function rAlerts(){
  const a=D.al,el=document.getElementById("tab-alerts"),v=S.alView;
  let h=`<div class="seg">${[["top","alTop"],["ai","alAI"],["watch","alWatch"],["stats","alStats"]].map(([k,l])=>`<button class="${v===k?"on":""}" onclick="S.alView='${k}';render()">${t(l)}</button>`).join("")}</div>`;
  if(a){h+=`<div class="card"><div class="row"><div class="mid">${t("alToday")}</div><div class="sp"></div><div class="mut">${esc(a.date)}</div></div><div style="margin-top:6px">`+
    (a.checks||[]).map(c=>`<span class="chip">${c.check==="premarket"?t("premarket"):esc(c.time)} · ${c.new} ${t("alNew")}</span>`).join("")+`</div></div>`}
  if(v==="stats"){el.innerHTML=h+alStatsHTML();return}
  if(!a){el.innerHTML=h+`<div class="card empty">${t("alNone")}</div>`;return}
  if(v==="watch"){const w=a.watch||[];
    h+=w.length?`<div class="card list">`+w.map(x=>`<div class="it"><div class="sp"><div class="nm">${esc(x.name)} <span class="cd">${esc(x.code)}</span></div>
      <div class="cd">${esc(S.lang==="zh"?x.group:(x.group_en||x.group))}</div><ul style="margin-top:2px">${(x["why_"+S.lang]||[]).map(y=>`<li>${esc(y)}</li>`).join("")}</ul></div><div class="r"><b>${num(x.price)}</b></div></div>`).join("")+`</div>`
      :`<div class="card empty">${t("alWatchNone")}</div>`;
    el.innerHTML=h;return}
  const rows=v==="ai"?(a.ai||[]):(a.top||[]);
  h+=rows.length?`<div class="card list">${rows.map(alRow).join("")}</div>`:`<div class="card empty">${t("alNone")}</div>`;

function openAlert(view,i){
  const a=D.al,r=(view==="ai"?a.ai:a.top)[i];if(!r)return;const dir=r.direction||alDir(r.type),hs=alHist(r.type,r.ai==1),b=D.ast&&D.ast.base;
  const hl=(r.headlines||"").split(" | ").filter(x=>x);
  sheet(`<div class="cd">${esc(r.code)} · ${esc(r.group)}</div><div class="mid">${esc(r.name)}</div>
   <div style="margin:6px 0"><span class="chip" style="color:var(--${dir==="bull"?"up":"down"})">${dir==="bull"?"▲ "+t("bull"):"▼ "+t("bear")} · ${esc(alLabel(r.type))}</span></div>
   <div class="grid3"><div class="tile">${t("price")}<b>${num(r.price)}</b></div><div class="tile">${t("alTime")}<b>${esc(r.time_tpe)}</b></div>
   <div class="tile">${r.level?t("alLevel"):t("alVol")}<b>${r.level?num(r.level):(r.vol_ratio?Number(r.vol_ratio).toFixed(1)+"x":"–")}</b></div></div>
   ${hs?`<div class="h2">${t("alHist")}</div><div class="grid3"><div class="tile">${t("alAvg10")}<b>${pct(hs.r10)}</b><span class="cd">${t("alAny")} ${pct(b.r10)}</span></div>
     <div class="tile">${dir==="bull"?t("alUp5"):t("alDn5")}<b>${Math.round((dir==="bull"?hs.up5:hs.down5)*100)}%</b><span class="cd">${t("alAny")} ${Math.round((dir==="bull"?b.up5:b.down5)*100)}%</span></div>
     <div class="tile">${t("alN")}<b>${num(hs.n)}</b></div></div>`:""}
   <div class="h2">${t("alHeadlines")}</div>${hl.length?`<ul>${hl.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<div class="mut">–</div>`}
   <div class="mut" style="margin-top:6px">${t("alSector")}: ${r.sector_news_n||0}</div>`);
}
function alStatsHTML(){
  const s=D.ast;if(!s)return `<div class="card empty">–</div>`;const b=s.base;
  let h=`<div class="card"><div class="mut">${t("alStatsNote")} (${esc(s.from)} → ${esc(s.to)})</div><div class="list" style="margin-top:6px">`;
  const order=Object.keys(s.types).sort((x,y)=>((s.types[y].all||{}).r10||0)-((s.types[x].all||{}).r10||0));
  h+=order.map(k=>{const a=s.types[k].all;if(!a)return "";const dir=alDir(k);
    return `<div class="it"><div class="sp"><div class="nm" style="font-size:14px">${esc(alLabel(k))}</div><div class="cd">${num(a.n)} ${t("alN")} · ${dir==="bull"?t("alUp5"):t("alDn5")} ${Math.round((dir==="bull"?a.up5:a.down5)*100)}%</div></div>
     <div class="r">${pct(a.r10)}<div class="cd">${t("alAvg10")}</div></div></div>`}).join("");
  h+=`<div class="it"><div class="sp"><div class="nm" style="font-size:14px">${t("alAny")}</div></div><div class="r">${pct(b.r10)}</div></div></div></div>`;

    return `<div class="it"><div class="sp"><div class="nm" style="font-size:14px">${esc(alLabel(k))}</div><div class="cd">${x.all.n} ${t("alN")}</div></div>
     <div class="r cd">${t("alWith")} ${w?pct(w.avg_r5):"–"}<br>${t("alWithout")} ${n?pct(n.avg_r5):"–"}</div></div>`}).join("")+`</div>`;
  return h+`</div>`;
}

/* ---------- PAPER ---------- */
function rPaper(){
  const pp=D.report.paper,el=document.getElementById("tab-paper");let h=`<div class="h2">${t("pp")}</div><div class="card">`;
  if(pp.closed)h+=`<div class="grid3"><div class="tile">${t("ppClosed")}<b>${pp.closed}</b></div><div class="tile">${t("ppWin")}<b>${Math.round(pp.wins/pp.closed*100)}%</b></div><div class="tile">${t("ppAvg")}<b>${pct((pp.avg_ret||0)/100)}</b></div></div>`;
  else h+=`<div class="mut">${t("ppNone")}</div>`;
  h+=`</div>`;
  const row=o=>`<div class="it"><div class="sp"><div class="nm">${esc(o.name)} <span class="cd">${esc(o.code)}</span></div><div class="cd">${esc(o.group)} · ${t("st")[o.status]||o.status}${o.entry_date?` · ${t("entry")} ${esc(o.entry_date)} @ ${num(o.entry_price)}`:""}</div></div>
     <div class="r">${o.return_pct!==""&&o.return_pct!=null?pct(Number(o.return_pct)/100):"–"}${o.target?`<div class="cd">${num(o.stop)} / ${num(o.target)}</div>`:""}</div></div>`;
  if(pp.open.length)h+=`<div class="h2">${t("ppOpen")}</div><div class="card list">${pp.open.map(row).join("")}</div>`;
  if((pp.pending||[]).length)h+=`<div class="h2">${t("ppPend")}</div><div class="card list">${pp.pending.map(row).join("")}</div>`;
  if((pp.recent_closed||[]).length)h+=`<div class="h2">${t("ppRecent")}</div><div class="card list">${pp.recent_closed.slice().reverse().map(row).join("")}</div>`;
  const lg=(D.log||[]).filter(x=>x.actual_close);
  h+=`<div class="h2">${t("acc")}</div><div class="card">`;
  if(lg.length){const o=lg.filter(x=>x.open_right==="1").length,c=lg.filter(x=>x.close_right==="1").length;
    h+=`<div class="grid2"><div class="tile">${t("open")}<b>${o}/${lg.length}</b></div><div class="tile">${t("close")}<b>${c}/${lg.length}</b></div></div><div class="list" style="margin-top:8px">`+
      lg.slice(-10).reverse().map(x=>`<div class="it"><div class="sp">${esc(x.date)}</div><div class="r cd">${t("open")} ${x.open_right==="1"?"✅":"❌"} ${t("close")} ${x.close_right==="1"?"✅":"❌"}<br>${num(x.pred_close)} → ${num(x.actual_close)}</div></div>`).join("")+`</div>`;
  }else h+=`<div class="mut">${t("scoreNone")}</div>`;
  el.innerHTML=h+`</div>`;
}

   <div class="opt" style="display:block"><div>${t("colors")}</div><div class="seg" style="margin:8px 0 0"><button class="${S.col==="tw"?"on":""}" onclick="setC('tw')">${t("colTW")}</button><button class="${S.col==="us"?"on":""}" onclick="setC('us')">${t("colUS")}</button></div></div>

function setL(l){S.lang=l;put("lang",l);render();openSettings()}
function setC(c){S.col=c;put("col",c);render();openSettings()}
window.onBack=function(){if(document.getElementById("sheet").classList.contains("on")){closeSheet();return true}if(S.tab!=="today"){go("today");return true}return false};
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&D.fetched&&Date.now()-new Date(D.fetched)>10*60*1000)load()});
const hp=new URLSearchParams(location.hash.slice(1));if(hp.get("tab"))S.tab=hp.get("tab");if(hp.get("lang"))S.lang=hp.get("lang");
const c0=get("cache");if(c0){try{D=JSON.parse(c0);D.offline=true}catch(e){}}
render();if(get("k")&&get("rsa"))load();else showLock();
</script>
